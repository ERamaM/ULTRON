# CodeRabbit AI code review configuration (free for public repositories).
# Install the app once at https://github.com/apps/coderabbitai for this repository.
language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main"]
  path_filters:
    - "!uv.lock"
    - "!tests/fixtures/**"
  path_instructions:
    - path: "skill/ultron/**/*.md"
      instructions: >-
        These files are prompts read by AI coding agents. Keep them in clear, concise English,
        never name platform-specific tools, and keep every CLI command referenced consistent
        with `ultron --help`.
    - path: "skill/ultron/scripts/ultron/core/rules/**"
      instructions: >-
        Heuristic job-posting rules. Multilingual match terms (Spanish, German, etc.) are intentional.
        Flag changes that could break the heuristic parity suite (tests/core/test_parity_heuristics.py)
        or that lack a regression test.
    - path: "skill/ultron/scripts/ultron/core/ats/**"
      instructions: >-
        ATS vendor clients. Every request must stay on the vendor's own hosts (VendorScopedClient);
        flag any SSRF, redirect-following or unbounded pagination risk.
    - path: "install.{py,sh,ps1}"
      instructions: >-
        Installers must work without a preinstalled Python, on paths with spaces or accents, and must
        keep stdout as a single JSON object. Flag anything that could delete folders the installer
        did not create.
  tools:
    ruff:
      enabled: true
    gitleaks:
      enabled: true
    shellcheck:
      enabled: true
    actionlint:
      enabled: true

chat:
  auto_reply: true
