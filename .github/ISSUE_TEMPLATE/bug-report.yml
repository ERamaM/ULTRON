name: Bug report
description: Report a crash, incorrect result, or installation problem in ULTRON.
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Use synthetic examples. Omit personal data, credentials, private URLs, local paths, and raw logs or exports.
        Report vulnerabilities through [private security advisories](https://github.com/ERamaM/ULTRON/security/advisories/new).
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the commands or actions in order. Replace paths, profiles, run IDs and other personal inputs with placeholders or synthetic examples.
      placeholder: |
        1. Install the bundled example profile.
        2. Run the command with synthetic input.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Summarize the failure and include the error code or a short sanitized message, if available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the ULTRON version or commit, operating system, installation method, and agent name/version. Use unknown for unavailable values.
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Public diagnostic
      description: If ULTRON launches, run `ultron doctor --public` and paste the JSON here. Leave this blank if the CLI cannot start or the option is unavailable.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report review
      options:
        - label: I checked this report for personal data, credentials, local paths, private links, and raw logs or exports.
          required: true
