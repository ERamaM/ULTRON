name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          chmod +x gitleaks
      - name: Scan git history and workspace
        shell: bash
        run: |
          ./gitleaks git --redact --verbose --config .gitleaks.toml .
          ./gitleaks dir --redact --verbose --config .gitleaks.toml .

  lint:
    name: Lint, Shell Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: sh -n install.sh
      - run: uv build --wheel --out-dir dist skill/ultron/scripts
      - name: Verify built artifacts
        shell: bash
        run: ls -la dist

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -q -rfE --junitxml=pytest-report.xml
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("pytest-report.xml")
          if not report.is_file():
              raise SystemExit(0)
          for case in ET.parse(report).getroot().iter("testcase"):
              for node in list(case.findall("failure")) + list(case.findall("error")):
                  title = f"{case.get('classname')}::{case.get('name')}"
                  body = (node.get("message") or "") + "\n" + (node.text or "")
                  body = body[-3500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={title}::{body}")
          PY

  coverage:
    name: Test coverage (Linux, Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      - name: Measure line and branch coverage
        run: |
          uv run pytest -q --cov --cov-branch \
            --cov-report=term \
            --cov-report=html:coverage-report/html \
            --cov-report=xml:coverage-report/coverage.xml \
            --cov-report=json:coverage-report/coverage.json             --junitxml=coverage-report/pytest-report.xml
      - name: Summarize coverage
        if: ${{ !cancelled() && hashFiles('coverage-report/coverage.json') != '' }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_dir = Path("coverage-report")
          totals = json.loads((report_dir / "coverage.json").read_text(encoding="utf-8"))["totals"]
          combined = f"{totals['percent_covered']:.1f}%"
          summary = ["## ULTRON test coverage", "", "| Metric | Coverage |", "| --- | ---: |"]
          for label, covered_key, count_key in (
              ("Lines", "covered_lines", "num_statements"),
              ("Branches", "covered_branches", "num_branches"),
          ):
              covered, count = totals[covered_key], totals[count_key]
              summary.append(f"| {label} | {covered}/{count} ({covered / count:.1%}) |")
          summary.append(f"| Combined | {combined} |")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n\n")
          badge = {"schemaVersion": 1, "label": "coverage", "message": combined, "color": "blue"}
          (report_dir / "badge.json").write_text(json.dumps(badge) + "\n", encoding="utf-8")
          PY
      - name: Report coverage of changed Python lines
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('coverage-report/coverage.xml') != '' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          uv run diff-cover coverage-report/coverage.xml --compare-branch="$BASE_SHA" \
            --format markdown:coverage-report/changed-lines.md
          cat coverage-report/changed-lines.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('coverage-report/**/*') != '' }}
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: error

  sonarcloud:
    name: SonarCloud analysis
    needs: [coverage]
    if: ${{ !cancelled() && needs.coverage.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Secrets are unavailable on fork pull requests; the scan is skipped there.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage-report
          path: coverage-report
      - name: Scan with SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.4.1
      - name: Note skipped scan
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not available; SonarCloud analysis skipped."

  coverage-badge:
    name: Publish coverage badge
    needs: [coverage, test, lint, secrets, install-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: ${{ runner.temp }}/ultron-coverage
      - name: Update the badge data branch
        shell: bash
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists. Skipping this badge update.'
            exit 0
          fi
          badge_ref=$(git ls-remote origin refs/heads/coverage-badge)
          if [[ -n "$badge_ref" ]]; then
            git fetch origin refs/heads/coverage-badge
            git switch --detach FETCH_HEAD
          else
            git switch --orphan coverage-badge
          fi
          cp "$RUNNER_TEMP/ultron-coverage/badge.json" badge.json
          git add -- badge.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Update coverage badge' -m "Measured at $GITHUB_SHA"
          git push origin HEAD:refs/heads/coverage-badge

  install-smoke:
    name: Installer Smoke (${{ matrix.os }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Run bootstrap installer (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export ULTRON_HOME="$RUNNER_TEMP/ultron-home"
          mkdir -p "$RUNNER_TEMP/smoke-proj"
          chmod +x ./install.sh
          ./install.sh --project "$RUNNER_TEMP/smoke-proj" --platforms claude,codex,opencode,antigravity
          test -f "$RUNNER_TEMP/smoke-proj/.claude/skills/ultron/SKILL.md"
          test -f "$RUNNER_TEMP/smoke-proj/.claude/skills/ultron/RUNTIME.md"
          test -f "$RUNNER_TEMP/smoke-proj/.agents/skills/ultron/SKILL.md"
          test -f "$RUNNER_TEMP/smoke-proj/.agents/skills/ultron/RUNTIME.md"
          "$ULTRON_HOME/venv/bin/ultron" version
          "$ULTRON_HOME/venv/bin/ultron" profile list
          "$ULTRON_HOME/venv/bin/ultron" profile install-example
      - name: Run bootstrap installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\install.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          $env:ULTRON_HOME = Join-Path $env:RUNNER_TEMP 'ultron-home'
          $proj = Join-Path $env:RUNNER_TEMP 'smoke-proj'
          New-Item -ItemType Directory -Path $proj -Force | Out-Null
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 --project $proj --platforms "claude,codex,opencode,antigravity"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($dir in @('.claude\skills\ultron', '.agents\skills\ultron')) {
            if (-not (Test-Path (Join-Path $proj "$dir\SKILL.md"))) { throw "Missing $dir\SKILL.md" }
            if (-not (Test-Path (Join-Path $proj "$dir\RUNTIME.md"))) { throw "Missing $dir\RUNTIME.md" }
          }
          $exe = Join-Path $env:ULTRON_HOME 'venv\Scripts\ultron.exe'
          & $exe version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe profile list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe profile install-example
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Regression: a single argument must not be splatted character by character.
          $out = powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = ($out -join "`n") | ConvertFrom-Json
          if (-not $result.dry_run) { throw 'Single-argument --dry-run was not applied' }
