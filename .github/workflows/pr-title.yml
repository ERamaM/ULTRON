name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  validate:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([[:alnum:]_.\/-]+( [[:alnum:]_.\/-]+)*\))?!?: [^[:space:]].*$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo '::error::Use type(scope)!: summary, with optional scope and !. Examples are fix: handle empty input and feat(export): add CSV export.'
            exit 1
          fi
