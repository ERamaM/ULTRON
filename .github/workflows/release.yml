name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Verify, Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --no-build --no-install-workspace
      - name: Link local workspace package
        run: uv run --locked --no-build --no-sync python -c "import pathlib, sysconfig; (pathlib.Path(sysconfig.get_path('purelib')) / '_ultron_workspace.pth').write_text(str(pathlib.Path('skill/ultron/scripts').resolve()) + '\n', encoding='utf-8')"
      - run: uv run --locked --no-build --no-sync ruff check
      - run: uv run --locked --no-build --no-sync pytest -q
      - name: Check release tag against package and runtime versions
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run --locked --no-build --no-sync python tools/check_release_version.py "$GITHUB_REF_NAME"
      - name: Build wheel distribution
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --out-dir dist skill/ultron/scripts
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ultron-dist
          path: dist/
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" dist/* --verify-tag --generate-notes
