title = "ULTRON Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic dummy tokens used solely to test secret redaction"
paths = [
  '''(?:^|/)tests/core/test_privacy_and_export\.py$''',
  '''(?:^|/)tests/eval/test_replay_run\.py$''',
  '''(?:^|/)tests/core/test_ats_occupop\.py$''',
  '''(?:^|/)tests/eval/test_arm_comparison\.py$''',
]

[[allowlists]]
description = "Ignore local virtual environments and build caches during directory scans"
paths = [
  '''(?:^|/)(?:\.venv|\.pytest_cache|\.ruff_cache|dist|build)/''',
]
