use_default_settings:
  engines:
    keep_only:
      - google
      - bing
      - duckduckgo
      - startpage
      - brave
      - qwant
      - yahoo
      - mojeek

# The allowlist alone preserves the image's enabled/disabled defaults.
engines:
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: yahoo
    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  - name: google
    disabled: false
  - name: duckduckgo
    disabled: true

general:
  instance_name: ULTRON SearXNG
  enable_metrics: false

search:
  formats: [html, json]
  suspended_times:
    SearxEngineTooManyRequests: 180
    SearxEngineCaptcha: 3600
    SearxEngineAccessDenied: 180

server:
  limiter: false
  image_proxy: false
  public_instance: false
  # The container receives its per-install key in SEARXNG_SECRET.

outgoing:
  request_timeout: 5.0
  max_request_timeout: 7.0
