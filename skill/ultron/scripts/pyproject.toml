[project]
name = "ultron"
version = "1.0.0"
description = "ULTRON - Universal Locator & Triage of Roles, Openings and Niches"
license = "MIT"
authors = [{ name = "Efrén Rama" }]
keywords = [
    "job-search",
    "ats",
    "ai-agent",
    "skill",
    "claude-code",
    "codex",
    "opencode",
    "antigravity",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "httpx<1",
    "beautifulsoup4<5",
    "pyyaml<7",
    "pydantic>=2,<3",
    "defusedxml<1",
]

[project.urls]
Homepage = "https://github.com/ERamaM/ULTRON"
Repository = "https://github.com/ERamaM/ULTRON"
Issues = "https://github.com/ERamaM/ULTRON/issues"

[project.optional-dependencies]
cv = ["pypdf<8"]
xlsx = ["openpyxl<4"]
search = ["ddgs>=8,<10"]

[project.scripts]
ultron = "ultron.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ultron"]

[tool.hatch.build.targets.wheel.force-include]
"../data" = "ultron/_data"
