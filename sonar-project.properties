sonar.organization=eramam
sonar.projectKey=ERamaM_ULTRON
sonar.projectName=ULTRON

sonar.python.version=3.12,3.13

# Produced by the CI coverage job (pyproject.toml sets relative_files = true).
sonar.python.coverage.reportPaths=coverage-report/coverage.xml
sonar.python.xunit.reportPath=coverage-report/pytest-report.xml

sonar.exclusions=**/__pycache__/**
# Tests are not production code, and the coverage job measures only the ultron package
# (install.py is tested through subprocesses).
sonar.test.inclusions=tests/**
sonar.coverage.exclusions=tests/**,install.py
