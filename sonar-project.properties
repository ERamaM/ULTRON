sonar.organization=eramam
sonar.projectKey=ERamaM_ULTRON
sonar.projectName=ULTRON

sonar.python.version=3.12,3.13

# Produced by the CI coverage job (pyproject.toml sets relative_files = true).
sonar.python.coverage.reportPaths=coverage-report/coverage.xml
sonar.python.xunit.reportPath=coverage-report/pytest-report.xml

sonar.exclusions=**/__pycache__/**
# Tests and static browser assets are not part of Python runtime coverage measurement
# (install.py is tested through subprocesses).
sonar.test.inclusions=tests/**
sonar.coverage.exclusions=tests/**,install.py,skill/ultron/scripts/ultron/exports/web_static/**
# install.py is a standalone, standard-library-only bootstrap that cannot import the ultron
# package, so a few helpers (e.g. the safe PATH lookup) are intentionally copied from it;
# tests/test_safe_which.py fails if the copies diverge.
sonar.cpd.exclusions=install.py
