schema_version: 1
corpus_version: 2026-11-20.2
purpose: Sanitized synthetic ground truth for offline quality benchmarking.
cases_glob: cases/*.yaml
fixtures_dir: fixtures
profiles_dir: profiles
minimum_cases: 210
split:
  algorithm: sha256(id) first 32 bits modulo 100
  dev_threshold: 70
  test_threshold: 30
labels: >-
  Independent ground truth, labelled from each posting's text against its case profile; tooling must never
  rewrite labels. On 2026-11-20 the owner delegated one relabelling to an agent: the 120 legacy cases were
  relabelled by the written rule in docs/self-improvement.md and 63 profile-diverse cases were added.
  The same delegation added 27 region-scope cases synthesized from live postings of sessions 3 and 4.
